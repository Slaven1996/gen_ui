# The notifications WebSocket (/api/socket.io) arrives as an HTTP request
# asking to upgrade. Pass that request on as it is; everything else keeps
# nginx's default `Connection: close` to the backend.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # nginx listens on 80 inside the container but is published on another port
  # (5173). An absolute redirect would name port 80 and drop the browser's
  # port, so any redirect stays relative to the URL the browser used.
  absolute_redirect off;

  # Inherited by every location below that proxies. A location declaring its
  # own proxy_set_header would drop all of these, so none of them do.
  #
  # $http_host, NOT $host: the backend compares the browser's Origin
  # ("http://localhost:5173") against the Host it received, and $host drops
  # the port, which makes every same-origin request look cross-origin.
  proxy_set_header Host              $http_host;
  proxy_set_header X-Forwarded-Host  $http_host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  # Keeps the browser on one origin, exactly like the Vite dev proxy does.
  # That is what makes the refresh cookie (SameSite=Strict, Path=/api/auth)
  # and the backend's Origin check work without any CORS configuration.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;

    # The assistant replies over SSE, and notifications arrive over a
    # WebSocket that stays open: never buffer, never time either out.
    # (Socket.IO pings every 25 s, so an open socket is never idle for long.)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Swagger UI, served by the API but published here so it shares the web app's
  # origin: "Try it out" then reaches /api same-origin, cookie and all. Covers
  # the page, its assets and /docs/openapi.{json,yaml}.
  location /docs {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
  }

  # Hashed build files are immutable; index.html must never be cached or a
  # deploy leaves browsers pointing at files that no longer exist. Vite writes
  # them to static/ (vite.config.ts), clear of app routes such as /assets.
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Any other path is an app route: a real file, or else the SPA. No `$uri/`:
  # a directory must never turn a route into a redirect.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
