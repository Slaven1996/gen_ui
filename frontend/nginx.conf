server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keeps the browser on one origin, exactly like the Vite dev proxy does.
  # That is what makes the refresh cookie (SameSite=Strict, Path=/api/auth)
  # and the backend's Origin check work without any CORS configuration.
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;

    # $http_host, NOT $host: the backend compares the browser's Origin
    # ("http://localhost:5173") against the Host it received, and $host drops
    # the port, which makes every same-origin request look cross-origin.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The assistant replies over SSE: never buffer, never time the stream out.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Hashed assets are immutable; index.html must never be cached or a deploy
  # leaves browsers pointing at asset files that no longer exist.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
