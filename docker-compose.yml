name: gen-ui

# `docker compose up --build` brings up the whole stack with no prior setup:
# the database (schema from backend/prisma/init.sql), the API (which seeds the
# demo data) and the web app on http://localhost:5173.
#
# Every value below has a development default, so this file works straight from
# a fresh clone. Override anything by exporting it or by passing your own env
# file: `docker compose --env-file backend/.env up`.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-genui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genui}
      POSTGRES_DB: ${POSTGRES_DB:-genui}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The whole schema in one file. Postgres runs it once, when the volume
      # is empty; after changing it, rebuild the database with `pnpm db:reset`
      # (or `pnpm docker:clean` for the whole stack).
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Containers talk to Postgres on the compose network, not the host port.
      DATABASE_URL: postgresql://${POSTGRES_USER:-genui}:${POSTGRES_PASSWORD:-genui}@postgres:5432/${POSTGRES_DB:-genui}?schema=public
      PORT: '3000'

      # Local demo over plain http://. A real deployment sets NODE_ENV=production,
      # which forces COOKIE_SECURE=true and therefore HTTPS.
      NODE_ENV: ${NODE_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Empty: host-only cookies.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # nginx is the only hop in front of the API.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Empty: the browser reaches the API same-origin through nginx.
      CORS_ORIGIN: ${CORS_ORIGIN:-}

      # DEVELOPMENT SECRET — generate your own before deploying anywhere:
      #   openssl rand -base64 48
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-insecure-secret-change-me-before-deploying-0000}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_ISSUER: ${JWT_ISSUER:-gen-ui-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gen-ui-web}

      # Refresh token: httpOnly cookie, rotated on every use.
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      # A rotated token shown again within this window is a multi-tab race, not theft.
      REFRESH_TOKEN_REUSE_GRACE_SECONDS: ${REFRESH_TOKEN_REUSE_GRACE_SECONDS:-10}
      # Expired refresh tokens are deleted this many days after expiry by a daily job.
      REFRESH_TOKEN_PRUNE_AFTER_DAYS: ${REFRESH_TOKEN_PRUNE_AFTER_DAYS:-30}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-refresh_token}

      # Chat answers 503 until the Anthropic key is set; everything else works.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-64000}
      # Max model↔tool round-trips per chat request.
      AI_MAX_STEPS: ${AI_MAX_STEPS:-15}
      AI_SEND_REASONING: ${AI_SEND_REASONING:-true}
      AI_REFUSAL_FALLBACK: ${AI_REFUSAL_FALLBACK:-true}
      # Longest device, tag or alarm rule list put in the prompt; a longer one is looked up.
      AI_PICK_LIST_INLINE_MAX: ${AI_PICK_LIST_INLINE_MAX:-100}

      # Simulated readings for ONLINE devices, so charts and alarms move in a demo.
      SIMULATOR_ENABLED: ${SIMULATOR_ENABLED:-true}
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-60}
      # Measurements older than this are deleted by a daily job.
      TELEMETRY_RETENTION_DAYS: ${TELEMETRY_RETENTION_DAYS:-180}

      # Demo: a made-up alarm notification every 60 s, 40% of the time, on top of the real ones.
      MOCK_ALARM_NOTIFICATIONS: ${MOCK_ALARM_NOTIFICATIONS:-true}
      # Notifications older than this are deleted by a daily job.
      NOTIFICATION_RETENTION_DAYS: ${NOTIFICATION_RETENTION_DAYS:-30}

      # The plant's time zone: shift times and the shift calendar's days are in it.
      SHIFT_TIME_ZONE: ${SHIFT_TIME_ZONE:-Europe/Budapest}

      # Demo data from backend/prisma/seed/*.sql. Set false to skip.
      SEED_ON_START: ${SEED_ON_START:-true}
    # Not published on purpose: the browser reaches the API through the
    # frontend's origin (http://localhost:5173/api), and leaving port 3000 free
    # means this stack never clashes with the API from `pnpm dev`. To hit the
    # API directly, uncomment:
    # ports:
    #   - '3001:3000'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-5173}:80'

volumes:
  pgdata:
